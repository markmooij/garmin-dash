# Production Docker Compose (Raspberry Pi)
# Docs: DEPLOY.md  —  Run: docker compose -f docker-compose.prod.yml up -d
#
# Reads .env from this directory (variables for substitution AND passed
# into the containers via env_file). Copy .env.prod.example → .env first.

services:
  app:
    image: ghcr.io/<your-github-user>/garmin-dash:latest
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "${GARMINDASH_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DOCKER_PROFILE=prod
      - DEBUG=false
      - TZ=${TZ:-Europe/Amsterdam}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - garmin-dash

  # Background ingestion: incremental sync every SYNC_INTERVAL_MINUTES,
  # morning Signal report + command polling (Phase 4, gated by SIGNAL_ENABLED).
  scheduler:
    image: ghcr.io/<your-github-user>/garmin-dash:latest
    platform: linux/arm64
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && exec gdash ingest schedule"]
    env_file:
      - .env
    environment:
      - DOCKER_PROFILE=prod
      - DEBUG=false
      - TZ=${TZ:-Europe/Amsterdam}
      # Signal API reachable by compose service name (used only when
      # the signal profile is active and SIGNAL_ENABLED=true)
      - SIGNAL_CLI_API_URL=http://signal-api:8080
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - garmin-dash

  # Signal REST API (Phase 4 — only when provisioned):
  #   docker compose -f docker-compose.prod.yml --profile signal up -d
  signal-api:
    image: bbernhard/signal-cli-rest-api:latest
    profiles: ["signal"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data/signal:/home/user/.signal
    environment:
      - SIGNAL_CLI_BIN=/usr/local/bin/signal-cli
      - SIGNAL_CLI_USERDATA=/home/user/.signal
    networks:
      - garmin-dash

networks:
  garmin-dash:
    driver: bridge
