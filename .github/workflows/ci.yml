name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv pip install -e ./libs/signal_messenger

      - name: Lint
        run: uv run ruff check app tests libs

      - name: Test (app)
        run: uv run pytest tests -q

      - name: Test (signal_messenger)
        run: cd libs/signal_messenger && uv run --with pytest pytest tests -q

  build-image:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    # Only build+push on tags (e.g. v0.1.0); PRs just verify the image builds.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
