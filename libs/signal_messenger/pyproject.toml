[project]
name = "signal-messenger"
version = "0.1.0"
description = "Standalone Signal messenger client for signal-cli-rest-api (bbernhard/signal-cli-rest-api)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Mark Mooij", email = "mark@ai-applied.nl" },
]
dependencies = [
  "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.6.9",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["signal_messenger*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
