# Production Docker Compose — single source of truth for both deployments.
# Docs: DEPLOY.md
#
# Raspberry Pi (rootful Docker, arm64, published image):
#   docker compose -f docker-compose.prod.yml --profile signal up -d
#
# Rootless Docker on this machine (amd64, locally built image): add the
# rootless override and PUID=0/PGID=0 in .env — see docker-compose.rootless.yml.
#
# Reads .env from the project directory (variables for substitution AND passed
# into the containers via env_file). Copy .env.prod.example → .env first.
#
# Relative paths (./data, ./logs, .env) resolve against the *project
# directory*, which defaults to the directory of the first -f file. Running
# these files from elsewhere? Pass --project-directory <dir-with-data-and-env>.

services:
  app:
    image: ${GARMINDASH_IMAGE:-ghcr.io/markmooij/garmin-dash:latest}
    # Native arch by default would be nicer, but an explicit default keeps the
    # documented Pi path working when cross-pulling; set GARMINDASH_PLATFORM
    # (linux/amd64 | linux/arm64) to match your host.
    platform: ${GARMINDASH_PLATFORM:-linux/arm64}
    restart: unless-stopped
    ports:
      - "${GARMINDASH_PORT:-8000}:8000"
    # Optional: without it the compose defaults below apply and the app falls
    # back to its own settings defaults (see .env.prod.example for a template).
    env_file:
      - path: .env
        required: false
    environment:
      - DOCKER_PROFILE=prod
      - DEBUG=false
      - TZ=${TZ:-Europe/Amsterdam}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - garmin-dash

  # Background ingestion: incremental sync every SYNC_INTERVAL_MINUTES,
  # morning Signal report + command polling (gated by SIGNAL_ENABLED).
  scheduler:
    image: ${GARMINDASH_IMAGE:-ghcr.io/markmooij/garmin-dash:latest}
    platform: ${GARMINDASH_PLATFORM:-linux/arm64}
    restart: unless-stopped
    command: ["sh", "-c", "gdash-migrate && exec gdash ingest schedule"]
    env_file:
      - path: .env
        required: false
    environment:
      - DOCKER_PROFILE=prod
      - DEBUG=false
      - TZ=${TZ:-Europe/Amsterdam}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Signal API reachable by compose service name (used only when
      # the signal profile is active and SIGNAL_ENABLED=true)
      - SIGNAL_CLI_API_URL=http://signal-api:8080
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # The image HEALTHCHECK probes /healthz, but the scheduler runs no web
    # server, so that probe would report "unhealthy" forever. Check instead
    # that PID 1 is still the running `gdash ingest schedule` command.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys
          cmd = open('/proc/1/cmdline','rb').read().decode(errors='replace')
          sys.exit(0 if 'ingest' in cmd and 'schedule' in cmd else 1)
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - garmin-dash

  # Signal REST API (only when provisioned): add --profile signal.
  signal-api:
    image: bbernhard/signal-cli-rest-api:latest
    profiles: ["signal"]
    restart: unless-stopped
    ports:
      - "${SIGNAL_API_PORT:-8080}:8080"
    volumes:
      # signal-cli stores its data in /home/.local/share/signal-cli
      # (SIGNAL_CLI_CONFIG_DIR default) — this is what must persist.
      - ./data/signal:/home/.local/share/signal-cli
    environment:
      # Path inside bbernhard/signal-cli-rest-api, which symlinks
      # /usr/bin/signal-cli -> /opt/signal-cli-<version>/bin/signal-cli.
      # Override if you run an image that installs it elsewhere.
      - SIGNAL_CLI_BIN=${SIGNAL_CLI_BIN:-/usr/bin/signal-cli}
    networks:
      - garmin-dash

networks:
  garmin-dash:
    driver: bridge
