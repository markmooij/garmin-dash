<!doctype html>
<html lang="nl" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Garmin Dash{% endblock %}</title>
  <link rel="stylesheet" href="{{ url('/static/vendor/uplot.min.css') }}">
  <link rel="stylesheet" href="{{ url('/static/css/app.css') }}">
  <script src="{{ url('/static/vendor/tailwind.js') }}"></script>
  <script defer src="{{ url('/static/vendor/alpine.min.js') }}"></script>
  <script>window.GDASH_ROOT = {{ root_path()|tojson }};</script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 antialiased">
  <nav class="border-b border-zinc-800 bg-zinc-950/90 sticky top-0 z-40 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-6">
      <a href="{{ url('/') }}" class="font-semibold tracking-tight text-zinc-100">
        <span class="text-emerald-400">garmin</span>·dash
      </a>
      <div class="flex gap-1 text-sm">
        <a href="{{ url('/') }}" class="px-3 py-1.5 rounded-md {% block nav_today %}{% endblock %}">Vandaag</a>
        <a href="{{ url('/trends') }}" class="px-3 py-1.5 rounded-md {% block nav_trends %}{% endblock %}">Trends</a>
        <a href="{{ url('/intraday') }}" class="px-3 py-1.5 rounded-md {% block nav_intraday %}{% endblock %}">Intraday</a>
        <a href="{{ url('/journal') }}" class="px-3 py-1.5 rounded-md {% block nav_journal %}{% endblock %}">Dagboek</a>
        <a href="{{ url('/insights') }}" class="px-3 py-1.5 rounded-md {% block nav_insights %}{% endblock %}">Inzichten</a>
        <a href="{{ url('/coach') }}" class="px-3 py-1.5 rounded-md {% block nav_coach %}{% endblock %}">Coach</a>
        <a href="{{ url('/uitleg') }}" class="px-3 py-1.5 rounded-md {% block nav_explanation %}{% endblock %}">Uitleg</a>
      </div>
      <div class="ml-auto text-xs text-zinc-500">Venu 2 · zelf-gehost</div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
