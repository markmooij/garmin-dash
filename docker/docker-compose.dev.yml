# Development Docker Compose (dev machine)
# Run: docker compose -f docker-compose.dev.yml up -d

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REGISTRY: ghcr.io
        APP_NAME: garmin-dash
        SIGNAL_API_NAME: signal-messenger
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    environment:
      - DEBUG=true
      - DOCKER_PROFILE=dev
      - GARMINTOKENS=${GARMINTOKENS}
      - SIGNAL_CLI_API_URL=http://localhost:8080
      - SIGNAL_CLI_TOKEN=${SIGNAL_CLI_TOKEN}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
    depends_on:
      - signal-api
    networks:
      - garmin-dash

  signal-api:
    image: bbernhard/signal-cli-rest-api:latest
    ports:
      - "8080:8080"
    volumes:
      - ../data/signal:/home/user/.signal
    environment:
      - SIGNAL_CLI_BIN=/usr/local/bin/signal-cli
      - SIGNAL_CLI_USERDATA=/home/user/.signal
    networks:
      - garmin-dash

networks:
  garmin-dash:
    driver: bridge
