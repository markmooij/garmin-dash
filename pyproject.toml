[project]
name = "garmin-dash"
version = "0.1.0"
description = "Self-hosted Garmin health & training analytics (Whoop-style dashboard)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Mark Mooij", email = "mark@ai-applied.nl" },
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.35",
  "alembic>=1.14.0",
  "garminconnect>=0.3.9",
  "garth>=0.8.0",
  "fitparse>=1.2.0",
  "apscheduler>=3.11.0",
  "httpx>=0.27.2",
  "pydantic-settings>=2.5.3",
  "python-dotenv>=1.0.1",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "black>=24.8.0",
]

[project.scripts]
gdash = "app.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "libs/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "TCH"]
ignore = ["E501", "B904", "TCH001"]

[tool.ruff.lint.isort]
known-first-party = ["app", "libs", "tests"]
lines-after-imports = 2

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
]
